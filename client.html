<html>
<head>
    <link href="client.css" type="text/css" rel="stylesheet">
    <script src="client.js" type="text/javascript"></script>
    <script src="serverstub.js" type="text/javascript"></script>
    <script type="text/view" id="profilescript">
        <body>
            <div id="profile">
                <button class="tablink" onclick="openTab('home', this)" id="default">Home</button>
                <button class="tablink" onclick="openTab('browse', this)">Browse</button>
                <button class="tablink" onclick="openTab('account', this)">Account</button>
            
                <div id="browse" class="tabcontent">
                    <form id="searchuser" onsubmit="searchUser(this); return false;">
                        <div class="searchtextfield">
                            <p class="searchfieldname">Enter email:</p>
                            <input type="email" name="searchemail" class="searchfieldinput" id="searchemail" required>
                        </div>
                        <input type="submit" value="Search">
                        <div id="feedbacksearch"></div>
                    </form>


                    <div id="browsemessagediv" style="display: none">
                        <div id="browseuserinfo" class="userinfo"></div>
                        <div id="browsemessageboard" class="messageboard">
                            <form id="broswemessagebar" class="messagebar" onsubmit="browseSendMessage(this); return false;">
                                <p>Post a message:</p>
                                <input type="text" name="messagefield" id="browsemessagefield" class="messagefield">
                                <input type="submit" value="Send Message">
                                <div id="browsefeedbackmessage"></div>
                            </form>
                            <button id="browsereloadbutton" onclick="browseReloadWall()">Reload Wall</button>
                            <h3 id="browsemessageheader" class="messageheader">Message Wall</h3>
                            <div id="browsemessagewall" class="messagewall"></div>
                        </div>  
                    </div>
                </div>

                <div id="home" class="tabcontent">
                    <div id="homeuserinfo" class="userinfo"></div>
                    <div id="homemessageboard" class="messageboard">
                        <form id="homemessagebar" class="messagebar" onsubmit="homeSendMessage(this); return false;">
                            <p>Post a message:</p>
                            <input type="text" name="messagefield" id="homemessagefield" class="messagefield">
                            <input type="submit" value="Send Message">
                            <div id="homefeedbackmessage"></div>
                        </form>
                        <button id="homereloadbutton" onclick="homeReloadWall()">Reload Wall</button>
                        <h3 id="homemessageheader" class="messageheader">Message Wall</h3>
                        <div id="homemessagewall" class="messagewall"></div>
                    </div>
                </div>
            
                <div id="account" class="tabcontent">
                    
                    <form id="changepassword" onsubmit="changePassword(this); return false;">
                        <div class="accounttextfield">
                            <p class="accountfieldname">Old Password</p>
                            <input type="text" name="oldpassword" class="accountfieldinput" id="oldpassword" required>
                        </div>
                        <div class="accounttextfield">
                            <p class="accountfieldname">New Password</p>
                            <input type="text" name="newpassword1" class="accountfieldinput" id="newpassword1" required>
                        </div>
                        <div class="accounttextfield">
                            <p class="accountfieldname">Reenter New Password</p>
                            <input type="text" name="newpassword2" class="accountfieldinput" id="newpassword2" required>
                        </div>
                        <input type="submit" value="Change">
                        <div id="feedbackChange"></div>
                        <button onclick="signOut()">Sign out</button>
                    </form>
                </div>
        
            </div>
        </body>
    </script>
    <script type="text/view" id="welcomescript"> 
        <div id="welcome">
            <div id="logo">
                <img src="wimage.png">
                
            </div>

            <div id="data">
                <form id="login" onsubmit="validatePasswordLogin(this); return false;">
                    <div class="textfield">
                        <p class="fieldname">Email</p>
                        <input type="email" name="email" class="fieldinput" id="loginemail" required>
                    </div>
                    <div class="textfield">
                        <p class="fieldname">Password</p>
                        <input type="text" name="password" class="fieldinput" id="loginpassword" required>
                    </div>
                    <input type="submit" value="Login" class="button">
                    <div id="feedbackLogin"></div>
                </form>

                <form id="signup" onsubmit="validatePasswordSignUp(this); return false;">
                    <p id="signuptext">Sign up here</p>
                    <div class="textfield">
                        <p class="fieldname">First Name</p>
                        <input type="text" name="firstname" class="fieldinput" id="firstname" required>
                    </div>

                    <div class="textfield">
                        <p class="fieldname">Family name</p>
                        <input type="text" name="familyname" class="fieldinput" id="familyname" required>
                    </div>

                    <div class="textfield">
                        <p class="fieldname">Gender</p>
                        <select type="" name="gender" class="fieldinput" id="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="textfield">
                        <p class="fieldname">City</p>
                        <input type="text" name="city" class="fieldinput" id="city" required>
                    </div>

                    <div class="textfield">
                        <p class="fieldname">Country</p>
                        <input type="text" name="country" class="fieldinput" id="country" required>
                    </div>
                    
                    <div class="textfield">
                        <p class="fieldname">Email</p>
                        <input type="email" name="signupemail" class="fieldinput" id="signupemail" required>
                    </div>
                    
                    <div class="textfield">
                        <p class="fieldname">Password</p>
                        <input type="text" name="signuppassword1" class="fieldinput" id="singuppassword1" required>
                    </div>
                    
                    <div class="textfield">
                        <p class="fieldname">Repeat PSW</p>
                        <input type="text" name="signuppassword2" class="fieldinput" id="signuppassword2" required>
                    </div>
                    <input type="submit" value="SignUp" class="button">
                    <div id="feedbackSignUp"></div>
                </form>
            </div>
        </div>
    </script>
</head>
<body>
   
</body>
</html>
