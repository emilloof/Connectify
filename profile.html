<html>
<head>
    <title>Profile</title>
    <link rel="stylesheet" type="text/css" href="profile.css">
    <script src="profile.js" type="text/javascript"></script>
    <script src="serverstub.js" type="text/javascript"></script>
</head>

<body>
    <div id="profile">
        <button class="tablink" onclick="openTab('home', this)" id="default">Home</button>
        <button class="tablink" onclick="openTab('browse', this)">Browse</button>
        <button class="tablink" onclick="openTab('account', this)">Account</button>

        <div id="home" class="tabcontent">
            <h2>Home</h2>
        </div>
    
        <div id="browse" class="tabcontent">
            <h2>Browse</h2>
        </div>
    
        <div id="account" class="tabcontent">
            <h2>Account</h2>
            <form id="changepassword" onsubmit="changePassword(this); return false;">
                <div class="textfield">
                    <p class="fieldname">Old Password</p>
                    <input type="text" name="oldpassword" class="fieldinput" id="oldpassword" required>
                </div>
                <div class="textfield">
                    <p class="fieldname">New Password</p>
                    <input type="text" name="newpassword1" class="fieldinput" id="newpassword1" required>
                </div>
                <div class="textfield">
                    <p class="fieldname">Reenter New Password</p>
                    <input type="text" name="newpassword2" class="fieldinput" id="newpassword2" required>
                </div>
                <input type="submit" value="Change" class="button">
                <div id="feedbackChange"></div>
            </form>
            <button onclick="signOut()">Sign out</button>
        </div>

    </div>
</body>

</html>
